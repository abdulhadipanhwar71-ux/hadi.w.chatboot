<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - WhatsApp Business Bot Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/admin">
                <i class="fa-brands fa-whatsapp text-success fs-3"></i>
                <span>WA Business Bot</span>
                <span class="badge bg-success-subtle text-success border border-success-subtle fs-7 ms-2">v1.0 Pro</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="topNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link {% if page_title == 'Dashboard' %}active fw-semibold{% endif %}" href="/admin">
                            <i class="fa-solid fa-chart-pie me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if page_title == 'Orders Management' %}active fw-semibold{% endif %}" href="/admin/orders">
                            <i class="fa-solid fa-shopping-bag me-1"></i> Orders
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if page_title == 'Product Catalog' %}active fw-semibold{% endif %}" href="/admin/products">
                            <i class="fa-solid fa-boxes-stacked me-1"></i> Products
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if page_title == 'Customers' %}active fw-semibold{% endif %}" href="/admin/customers">
                            <i class="fa-solid fa-users me-1"></i> Customers
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if page_title == 'Message History' %}active fw-semibold{% endif %}" href="/admin/messages">
                            <i class="fa-solid fa-comments me-1"></i> Message Logs
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a href="/simulator" target="_blank" class="btn btn-outline-success btn-sm px-3 fw-medium">
                        <i class="fa-brands fa-whatsapp me-1"></i> Open Live Simulator
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container-fluid px-4 py-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
